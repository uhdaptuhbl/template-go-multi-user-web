# Reverse proxy for the local stack, and a starting point for a real one.
#
# docs/adr/0007-deployment-topology.md says this service is always deployed
# behind a TLS-terminating reverse proxy. This file is the local half of that:
# it sets the forwarded headers a real edge sets, so that a mistake in how the
# service reads them shows up on a developer machine instead of in production.
#
# It is not a production configuration. There is no TLS, no HTTP-to-HTTPS
# redirect, no HSTS, no compression, and no rate limiting; ADR 0007 names all
# of those as the real proxy's responsibilities. What carries over unchanged is
# the proxy_set_header block, which is the part with a wrong answer that looks
# right.
#
# See specs/007-local-gateway/.

events {}

http {
    # To stdout, so `docker compose logs gateway` collects it the way it
    # collects every other service's output. The image symlinks these already;
    # stating them keeps the file self-contained for a reader copying it.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;

        location / {
            proxy_pass http://app:8080;

            # The peer that connected to nginx, replacing whatever the client
            # sent rather than appending to it.
            #
            # $proxy_add_x_forwarded_for is the form most examples use, and it
            # is wrong here. It appends, which is correct only behind another
            # trusted edge, where each entry is verifiable back to that edge.
            # nginx is the edge, so anything already in the header came from
            # the client. The service walks this header right to left and
            # returns the first address that is not a trusted proxy; with the
            # appending form, a client sending "X-Forwarded-For: 1.2.3.4"
            # produces "1.2.3.4, <docker bridge>", the bridge is inside the
            # trusted CIDR, and the request is attributed to whatever the
            # client chose.
            proxy_set_header X-Forwarded-For $remote_addr;

            # Generated here, not forwarded. nginx's $request_id is 32
            # hexadecimal characters, which is what the service's own
            # generator produces and what its validator accepts. The service
            # adopts an identifier supplied by a trusted peer, and this proxy
            # is trusted, so passing the client's value through would let a
            # client choose its own correlation ID and collide with someone
            # else's on purpose.
            proxy_set_header X-Request-Id $request_id;

            # $scheme, which is http here. Not hard-coded to https: that would
            # be a claim the service could act on and it would be false.
            proxy_set_header X-Forwarded-Proto $scheme;

            # The name the client asked for, so an absolute URL or a redirect
            # the service builds names an address the client can reach.
            proxy_set_header Host $host;
        }
    }
}
