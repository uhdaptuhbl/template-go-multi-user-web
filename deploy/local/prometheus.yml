# Scrape config for the local compose stack (see deploy/local/compose.yaml).
#
# 5s is short on purpose: it makes a local session show data quickly.
# Production scrapes slower; this file is not that config.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: service
    metrics_path: /metrics
    static_configs:
      - targets: ["app:9090"]
