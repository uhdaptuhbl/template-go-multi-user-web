# Dependency updates arrive as pull requests that CI gates, so a stale
# dependency is noticed before the vulnerability job fails on someone else's
# unrelated change. See specs/004-release-automation/ story 3.
#
# Nothing here merges anything: every update is reviewed and merged by a human.

version: 2

updates:
  # ---------------------------------------------------------------------
  # Go modules
  # ---------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits, because CLAUDE.md requires them of every commit
      # and the release notes are generated by grouping on these prefixes.
      prefix: build
      include: scope
    groups:
      # One pull request per week for the routine drift, rather than fifteen.
      # Majors stay separate: they are the ones that need reading.
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------
  # Container base images
  #
  # Covers both Dockerfile and Dockerfile.release, which share a root
  # directory and must not drift apart in their runtime base.
  # ---------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope

  # ---------------------------------------------------------------------
  # Local observability stack
  #
  # The Jaeger and Prometheus images the Compose file pins, so a developer
  # is not debugging against a backend two years behind the one in production.
  # ---------------------------------------------------------------------
  - package-ecosystem: docker-compose
    directory: /deploy/local
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
